    <script>
      // 🛡️ Zero-Level Silent Error Shield for Preview Environment
      (function() {
        var isTargetError = function(str) {
          if (!str) return false;
          var s = String(str).toLowerCase();
          return s.includes('websocket') || 
                 s.includes('closed without opened') || 
                 s.includes('[vite]') || 
                 s.includes('failed to connect to websocket') ||
                 s.includes('stopped');
        };

        window.addEventListener('error', function(e) {
          if (isTargetError(e && e.message) || isTargetError(e && e.error && e.error.message)) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && (e.reason ? (e.reason.message || String(e.reason)) : '');
          if (isTargetError(reason)) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
